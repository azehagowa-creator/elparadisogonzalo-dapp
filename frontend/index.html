
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Paraiso Gonzalo - Web3 App</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root">
        <!-- Your web3 application's content will be rendered here by JavaScript -->
        <h1>Welcome to El Paraiso Gonzalo!</h1>
        <p>Connecting to the blockchain...</p>
        <button id="connect-wallet-button">Connect Wallet</button>
        <div id="wallet-info"></div>
        <div id="app-content"></div>
    </div>

    <!-- Link to your web3 JavaScript library (e.g., ethers.js) -->
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>

    <!-- Link to your application's main JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
